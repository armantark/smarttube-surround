name: Build and publish

on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Upstream SmartTube beta tag to build (default, the newest beta release)
        required: false

# Releases are published one at a time, so "latest" always follows the newest build.
concurrency: build

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_DIR: /tmp/upstream
      KEYSTORE_FILE: /tmp/release.jks
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        id: Checkout
        uses: actions/checkout@v4

      - name: Find the upstream tag
        id: Find_the_upstream_tag
        env:
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        run: |
          tag=$REQUESTED_TAG
          if [[ -z $tag ]]; then
            # Beta tags are the bare version and published as prereleases; "32.56s" is stable.
            tag=$(scripts/retry.sh gh api repos/yuliskov/SmartTube/releases --jq \
              '[.[] | select(.prerelease and (.tag_name | test("^[0-9.]+$")))][0].tag_name')
          fi
          [[ $tag =~ ^[0-9.]+$ ]] || { echo "not an upstream beta tag: '$tag'" >&2; exit 1; }
          revision=$(<patch-revision)
          [[ $revision =~ ^[0-9]+$ ]] || { echo "patch-revision must hold a number" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$tag-r$revision" >> "$GITHUB_OUTPUT"

      - name: Skip existing release
        id: Skip_existing_release
        env:
          RELEASE: ${{ steps.Find_the_upstream_tag.outputs.release }}
        run: |
          # A failed API call must fail the job, never masquerade as a missing release.
          existing=$(scripts/retry.sh gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$RELEASE\" and (.draft | not)) | .tag_name")
          if [[ -n $existing ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "$RELEASE already exists; nothing to build."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        id: Set_up_Java
        if: steps.Skip_existing_release.outputs.needed == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Apply patches
        id: Apply_patches
        if: steps.Skip_existing_release.outputs.needed == 'true'
        env:
          UPSTREAM_TAG: ${{ steps.Find_the_upstream_tag.outputs.tag }}
        run: scripts/build.sh "$UPSTREAM_TAG" --prepare-only

      - name: Restore the signing key
        id: Restore_the_signing_key
        if: steps.Skip_existing_release.outputs.needed == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: base64 --decode <<< "$KEYSTORE_BASE64" > "$KEYSTORE_FILE"

      - name: Build
        id: Build
        if: steps.Skip_existing_release.outputs.needed == 'true'
        env:
          UPSTREAM_TAG: ${{ steps.Find_the_upstream_tag.outputs.tag }}
        run: scripts/build.sh "$UPSTREAM_TAG" --build-only

      - name: Stage the release assets
        id: Stage_the_release_assets
        if: steps.Skip_existing_release.outputs.needed == 'true'
        env:
          UPSTREAM_TAG: ${{ steps.Find_the_upstream_tag.outputs.tag }}
        run: scripts/release-assets.sh "$UPSTREAM_TAG" dist

      - name: Verify the signatures
        id: Verify_the_signatures
        if: steps.Skip_existing_release.outputs.needed == 'true'
        run: scripts/verify-apks.sh dist

      - name: Publish
        id: Publish
        if: steps.Skip_existing_release.outputs.needed == 'true'
        env:
          UPSTREAM_TAG: ${{ steps.Find_the_upstream_tag.outputs.tag }}
          RELEASE: ${{ steps.Find_the_upstream_tag.outputs.release }}
        run: |
          url=$(scripts/retry.sh scripts/publish-release.sh "$RELEASE" dist \
            "SmartTube $UPSTREAM_TAG with patch revision $(<patch-revision).")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Notify publication
        id: Notify_publication
        if: steps.Publish.outcome == 'success'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RELEASE: ${{ steps.Find_the_upstream_tag.outputs.release }}
          RELEASE_URL: ${{ steps.Publish.outputs.url }}
        run: |
          : "${NTFY_TOPIC:?NTFY_TOPIC must be set}"
          curl --silent --show-error --fail --retry 3 --retry-all-errors --retry-delay 5 \
            --connect-timeout 10 --max-time 30 --output /dev/null \
            --header "Title: SmartTube published: $RELEASE" --header 'Priority: 2' \
            --header "Click: $RELEASE_URL" \
            --data-binary "$RELEASE published: $RELEASE_URL" "https://ntfy.sh/$NTFY_TOPIC"

      - name: Notify failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          UPSTREAM_TAG: ${{ steps.Find_the_upstream_tag.outputs.tag || inputs.upstream_tag || 'unresolved (newest beta)' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STEPS: ${{ toJSON(steps) }}
        run: |
          : "${NTFY_TOPIC:?NTFY_TOPIC must be set}"
          # Step IDs match the display names, with spaces replaced by underscores.
          failed=$(jq -r 'to_entries | map(select(.value.outcome == "failure") | .key | gsub("_"; " ")) | join(", ")' <<< "$STEPS")
          curl --silent --show-error --fail --retry 3 --retry-all-errors --retry-delay 5 \
            --connect-timeout 10 --max-time 30 --output /dev/null \
            --header "Title: SmartTube failed: $failed" --header 'Priority: 4' \
            --header "Click: $RUN_URL" \
            --data-binary "Upstream $UPSTREAM_TAG failed at $failed. $RUN_URL" "https://ntfy.sh/$NTFY_TOPIC"
