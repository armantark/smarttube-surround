name: Build and publish

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Upstream SmartTube beta tag to build (default, the newest beta release)
        required: false

# Releases are published one at a time, so "latest" always follows the newest build.
concurrency: build

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_DIR: ${{ runner.temp }}/upstream
      KEYSTORE_FILE: ${{ runner.temp }}/release.jks
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Find the upstream tag
        id: upstream
        env:
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        run: |
          tag=$REQUESTED_TAG
          if [[ -z $tag ]]; then
            # Beta tags are the bare version and published as prereleases; "32.56s" is stable.
            tag=$(gh api repos/yuliskov/SmartTube/releases --jq \
              '[.[] | select(.prerelease and (.tag_name | test("^[0-9.]+$")))][0].tag_name')
          fi
          [[ $tag =~ ^[0-9.]+$ ]] || { echo "not an upstream beta tag: '$tag'" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$tag-r$(<patch-revision)" >> "$GITHUB_OUTPUT"

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: base64 --decode <<< "$KEYSTORE_BASE64" > "$KEYSTORE_FILE"

      - name: Build
        run: scripts/build.sh "${{ steps.upstream.outputs.tag }}"

      - name: Stage the release assets
        run: scripts/release-assets.sh "${{ steps.upstream.outputs.tag }}" dist

      - name: Verify the signatures
        run: scripts/verify-apks.sh dist

      - name: Publish
        run: |
          gh release create "${{ steps.upstream.outputs.release }}" dist/* \
            --title "${{ steps.upstream.outputs.release }}" \
            --notes "SmartTube ${{ steps.upstream.outputs.tag }} with patch revision $(<patch-revision)." \
            --latest
